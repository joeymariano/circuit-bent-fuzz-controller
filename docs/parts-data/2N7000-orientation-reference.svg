<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="460" fill="#ffffff"/>
  <text x="280" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">T1/T2/T3 — TO-92 2N7000 footprint (as designed)</text>
  <text x="280" y="56" font-size="13" text-anchor="middle" fill="#555">top view of the board · silk is CORRECT / standard S-G-D</text>

  <!-- D-shaped body outline: flat edge at BOTTOM, rounded TOP -->
  <path d="M 150 300 L 150 170 A 130 130 0 0 1 410 170 L 410 300 Z"
        fill="#f4f1e8" stroke="#333" stroke-width="2.5"/>
  <text x="280" y="150" font-size="13" fill="#555" text-anchor="middle">rounded back</text>

  <!-- flat edge callout -->
  <line x1="150" y1="300" x2="410" y2="300" stroke="#c0392b" stroke-width="4"/>
  <text x="280" y="330" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">FLAT edge — transistor's flat face points here</text>

  <!-- pads (row near the flat edge). pin1 = square on the LEFT -->
  <!-- pin1 SOURCE (square) -->
  <rect x="176" y="250" width="34" height="46" fill="#d9b310" stroke="#7a5c00" stroke-width="2"/>
  <text x="193" y="278" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">1</text>
  <!-- pin2 GATE -->
  <ellipse cx="280" cy="273" rx="17" ry="23" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
  <text x="280" y="278" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">2</text>
  <!-- pin3 DRAIN -->
  <ellipse cx="367" cy="273" rx="17" ry="23" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
  <text x="367" y="278" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">3</text>

  <!-- labels -->
  <text x="193" y="392" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">SOURCE</text>
  <text x="193" y="410" font-size="12" text-anchor="middle" fill="#333">square pad</text>
  <text x="193" y="428" font-size="12" text-anchor="middle" fill="#0a7d34">INTRPT_OUT → GND</text>

  <text x="280" y="392" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">GATE</text>
  <text x="280" y="410" font-size="12" text-anchor="middle" fill="#333">middle</text>
  <text x="280" y="428" font-size="12" text-anchor="middle" fill="#0a58a7">via R3 → D1</text>

  <text x="367" y="392" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">DRAIN</text>
  <text x="367" y="410" font-size="12" text-anchor="middle" fill="#333">far pad</text>
  <text x="367" y="428" font-size="12" text-anchor="middle" fill="#b8570a">INTRPT → LED side</text>

  <!-- connector lines pad->label -->
  <line x1="193" y1="296" x2="193" y2="378" stroke="#bbb" stroke-width="1"/>
  <line x1="280" y1="296" x2="280" y2="378" stroke="#bbb" stroke-width="1"/>
  <line x1="367" y1="296" x2="367" y2="378" stroke="#bbb" stroke-width="1"/>

  <!-- real-part reference -->
  <text x="470" y="200" font-size="12" fill="#555" text-anchor="middle">real 2N7000</text>
  <text x="470" y="216" font-size="12" fill="#555" text-anchor="middle">flat toward you,</text>
  <text x="470" y="232" font-size="12" fill="#555" text-anchor="middle">legs down:</text>
  <text x="470" y="252" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">S  G  D</text>
</svg>
